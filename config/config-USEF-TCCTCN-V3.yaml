optimizer: !name:torch.optim.Adam
  lr: 0.0001
  weight_decay: 0

checkpoint: 1
continue_from: 'chkpt/init_frontend_from_sepformer_wsj0-2mix_for_tcctcn.pth.tar'
max_norm: 5
use_amp: True
amp_dtype: bfloat16
print_freq: 100
name: USEF-TCCTCN-V3/wsj0-2mix

# frontend freezing control
freeze_frontend_warmup: True
frontend_warmup_epochs: 3
frontend_unfreeze_lr_scale: 0.1

epochs: 200
batch_size: 2
num_workers: 8
valid_batch_size: 1
num_spks: 1

duration: 4
sample_rate: 8000
# Validation-only controls:
# valid_chunk_* makes trainer validation run long mixtures in chunks to reduce GPU memory.
# valid_wake_aux_duration caps the enrollment/aux audio length passed by te_dataset.
valid_chunk_duration: 4
valid_chunk_hop_duration: 4
valid_wake_aux_duration: 3

dataset_type: wsj0-2mix  # [wsj0-2mix, libri2mix]
train_path: data/train/wsj0-2mix
valid_path: data/dev/wsj0-2mix
test_path: data/test/wsj0-2mix

mix_scp: mix.scp
ref_scp: ref.scp
aux_scp: aux.scp

# Encoder parameters
N_encoder_out: 256
out_channels: 256
encoder_kernel_size: 16
encoder_kernel_stride: 8
embd: 256

# Target-Conditioned TCN-V3 backend parameters
tc_conv_channels: 512
tc_skip_channels: 256
tc_kernel_size: 3
tc_num_blocks: 8
tc_num_repeats: 3
tc_norm: fln
tc_causal: True
tc_dropout: 0.0
mask_activation: sigmoid
use_gated_residual_film: True

# Target conditioning controls.
tc_cond_scale_init: 0.1
tc_cond_scale_trainable: True
tc_zero_init_cond_proj: True
tc_condition_depthwise: True
tc_condition_residual: True
tc_condition_skip: True
reset_tc_conditioning_on_continue: True

# Penalize estimates that become too similar to the non-target residual
# mixture - target. This is aimed at reducing target-swap failures.
lambda_anti: 0.05
anti_sisnr_margin: 0.0

Encoder: !new:models.model_USEF_TCCTCN_V3.Encoder
  kernel_size: !ref <encoder_kernel_size>
  out_channels: !ref <N_encoder_out>

Decoder: !new:models.model_USEF_TCCTCN_V3.Decoder
  in_channels: !ref <N_encoder_out>
  out_channels: 1
  kernel_size: !ref <encoder_kernel_size>
  stride: !ref <encoder_kernel_stride>
  bias: False

Fusion_mdl: !new:models.local.TransformerEncoderCross.TransformerEncoderCross
  num_layers: 4
  d_model: !ref <out_channels>
  nhead: 8
  d_ffn: 1024
  dropout: 0

FiLM: !new:models.model_USEF_TCCTCN_V3.FiLM
  size: !ref <out_channels>

MaskNet: !new:models.model_USEF_TCCTCN_V3.Tar_Model
  encoder: !ref <Encoder>
  decoder: !ref <Decoder>
  fusion_mdl: !ref <Fusion_mdl>
  film: !ref <FiLM>
  in_channels: !ref <N_encoder_out>
  out_channels: !ref <out_channels>
  num_spks: !ref <num_spks>
  conv_channels: !ref <tc_conv_channels>
  skip_channels: !ref <tc_skip_channels>
  kernel_size: !ref <tc_kernel_size>
  num_blocks: !ref <tc_num_blocks>
  num_repeats: !ref <tc_num_repeats>
  norm: !ref <tc_norm>
  causal: !ref <tc_causal>
  dropout: !ref <tc_dropout>
  mask_activation: !ref <mask_activation>
  use_gated_residual_film: !ref <use_gated_residual_film>
  cond_scale_init: !ref <tc_cond_scale_init>
  cond_scale_trainable: !ref <tc_cond_scale_trainable>
  zero_init_cond_proj: !ref <tc_zero_init_cond_proj>
  condition_depthwise: !ref <tc_condition_depthwise>
  condition_residual: !ref <tc_condition_residual>
  condition_skip: !ref <tc_condition_skip>

modules:
  masknet: !ref <MaskNet>
